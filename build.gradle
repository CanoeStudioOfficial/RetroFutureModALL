plugins {
    id 'base'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1' apply false
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3' apply false
    id 'net.darkhax.curseforgegradle' version '1.+' apply false
    id 'com.modrinth.minotaur' version '2.+' apply false
    id 'org.jetbrains.changelog' version '2.5.0' apply false
    id 'com.gradleup.shadow' version '9.6.+' apply false
}

subprojects {
    if (path != ':all') {
        apply from: rootProject.file('gradle/scripts/mod-build.gradle')
    }
}

def modProjects = { subprojects.findAll { it.path != ':all' }.sort { it.name } }

tasks.named('build') {
    dependsOn modProjects().collect { "${it.path}:build" }
    dependsOn ':all:jar'
}

tasks.register('buildAllMods') {
    group = 'build'
    description = 'Builds every mod module under modules/.'
    dependsOn modProjects().collect { "${it.path}:build" }
}

tasks.register('buildAllInOne') {
    group = 'build'
    description = 'Builds the all-in-one distribution jar.'
    dependsOn ':all:jar'
}

tasks.register('all') {
    group = 'build'
    description = 'Builds the RetroFuture all-in-one distribution jar.'
    dependsOn 'buildAllInOne'
}

tasks.register('listMods') {
    group = 'help'
    description = 'Lists all discovered mod modules.'
    doLast {
        modProjects().each { project ->
            println "${project.path} -> ${project.projectDir}"
        }
    }
}
